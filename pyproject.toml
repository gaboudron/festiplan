[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "festiplan"
version = "0.1.0"
description = "API de gestion d'un festival fictif (FestiPlan)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.40",
    "pydantic>=2.11.3",
    "pydantic-settings>=2.8.1",
    "python-dotenv>=1.1.0",
    "alembic>=1.15.2",
    "pytest>=8.3.5",
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
